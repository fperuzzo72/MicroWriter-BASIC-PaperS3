; MicroWriter-BASIC-PaperS3 -- M5Stack PaperS3 (official), ESP32-S3R8.
;
; Hardware comes from freeink-sdk's M5PAPERS3 profile (960x540 raw-parallel
; EPD over the S3's LCD/i80 peripheral, GT911 touch, BM8563 RTC, SPI SD).
; Pin evidence and the CONFIRMED/PENDING breakdown live in
; freeink-sdk/docs/m5papers3-support.md -- read it before touching any pin.
;
;   pio run -e m5papers3 -t upload

[platformio]
default_envs = m5papers3
build_cache_dir = .cache

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitm-1
board_build.mcu = esp32s3
framework = arduino
; The platform declares framework-arduinoespressif32 as optional and resolves it
; by URL, so it does not auto-install when an older registry-owned copy of the
; same package name is already in ~/.platformio/packages -- FRAMEWORK_DIR comes
; back None and the build dies in arduino.py with a bare TypeError. Pinning the
; exact URI the platform expects makes resolution explicit and reproducible.
platform_packages =
  espressif/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7.tar.xz
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
; Octal PSRAM -- required by this device. 8MB, which is why SCREEN 4 (graphics)
; is finally viable here; the X4 had 380KB total and no PSRAM at all.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; MicroBASIC lives in app1 -- app0 is CrossPoint's slot on this shared
; dual-boot unit. Both numbers must track partitions.csv's app1 row, which in
; turn matches what is actually on the device; they were out of sync for a long
; time, see docs/DEVELOPMENT_LOG.md's "partitions.csv doesn't match the real
; device". Keep all three in step if the layout ever changes again, and see
; docs/DUAL_BOOT.md before it does -- the layout is a device-wide contract
; shared with crosspoint-reader-m5papers3, not this project's own file.
board_upload.maximum_size = 2621440     ; app1 = 2560K
board_upload.offset_address = 0x620000  ; app1

build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_M5PAPERS3=1
  -DFREEINK_LGFX_EPD_CONFIG=m5PaperS3LgfxConfig
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DUSE_UTF8_LONG_NAMES=1
  -DCORE_DEBUG_LEVEL=0
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  ; USB HID Host (wired keyboard over USB-OTG) is left OFF for now: the
  ; PaperS3's USB-C port is hardwired CC-pulldown (device/sink only, see
  ; UsbHidKeyboardHost.h and the schematic evidence in the dev log) and the
  ; one workaround tried (an externally-powered hub) hit what looks like a
  ; separate limitation in the (beta) ESP-IDF external-hub driver's
  ; downstream port-power sequencing. The module stays in the tree, ready to
  ; re-enable (-DFREEINK_CAP_USB_HID_KBD_HOST=1, -DARDUINO_USB_CDC_ON_BOOT=0)
  ; if a genuine power-injection OTG cable turns up. CDC_ON_BOOT is back to
  ; 1 here so serial logging works again for BLE bring-up below.
  ; -DFREEINK_CAP_USB_HID_KBD_HOST=1
  -DFREEINK_CAP_BLE_HID_HOST=1
  -DFREEINK_BLE_HID_SHOW_UNNAMED_DEVICES=0
  -DCONFIG_BT_NIMBLE_EXT_ADV=1
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=1
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=1
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=4

; Milestone 1 is hardware bring-up: prove display + touch + SD on the real
; panel before porting any MicroBASIC feature. The X4 sources sit in
; port-staging/ and move into src/ one at a time as each is ported.
build_src_filter =
  +<*>

lib_deps =
  BatteryMonitor=symlink://../freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://../freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://../freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://../freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://../freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://../freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://../freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://../freeink-sdk/libs/hardware/Rtc
  Imu=symlink://../freeink-sdk/libs/hardware/Imu
  UsbHidKeyboardHost=symlink://../freeink-sdk/libs/hardware/UsbHidKeyboardHost
  BleKeyboardHost=symlink://../freeink-sdk/libs/network/BleKeyboardHost
  h2zero/NimBLE-Arduino @ ^2.3.8
  ; Pinned to exactly the version crosspoint-reader-m5papers3 builds against
  ; (that firmware is proven to drive this panel). Left unpinned, PlatformIO
  ; resolved 0.2.27 -- one release newer than cpr's 0.2.26 -- for the initial
  ; bring-up, an unconfirmed variable in the display-never-updates failure.
  ;
  ; By git tag rather than "m5stack/M5GFX @ 0.2.26": the registry stopped
  ; resolving that spec (UnknownPackageError) when a second env asked for it,
  ; even though the first env already had it cached. Same reason the platform
  ; package above is pinned by URL -- an explicit source resolves the same way
  ; every time, on every env.
  https://github.com/m5stack/M5GFX.git#0.2.26

lib_ignore =
  BLE


; --- The two machines ------------------------------------------------------
; One codebase, two firmwares, so a fix in the shared parts reaches both
; without anyone having to remember to carry it. They are flashed into the
; same app1 slot, one at a time (see docs/DUAL_BOOT.md) -- the device holds
; CrossPoint plus whichever of these two was written last.
;
; MicroWriter is not MicroBASIC with the prompt hidden: the interpreter and
; everything that talks to it are excluded from the build, not compiled and
; ignored. What is left is the writing machine MicroBASIC grew out of.

[env:m5papers3]
extends = base

[env:microwriter]
extends = base
build_flags =
  ${base.build_flags}
  -DMICROWRITER=1
; Excluded rather than #if'd out: the interpreter (tb_*), the character-grid
; terminal it draws into (screen_editor), and the command dispatch and
; terminal key handling built on top of them (terminal_input). The key queue,
; dead keys and hidToAscii stay in input_handler.cpp, which both need.
build_src_filter =
  +<*>
  -<tb_bridge.cpp>
  -<tb_runtime.cpp>
  -<screen_editor.cpp>
  -<terminal_input.cpp>
lib_ignore =
  ${base.lib_ignore}
  TinyBasic
